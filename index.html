<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Brick Game - Hardcore</title>
    <style>
        :root {
            --lcd-bg: #9ead86;
            --dark-color: #000;
        }

        body {
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'monospace';
            touch-action: none;
            flex-direction: column;
        }

        #device {
            background: var(--lcd-bg);
            padding: 15px;
            border: 8px solid #444;
            border-radius: 5px;
            display: flex;
            gap: 15px;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas { background: var(--lcd-bg); display: block; }
        .main-canvas { border: 2px solid #333; }

        .side-panel {
            display: flex;
            flex-direction: column;
            min-width: 80px;
            color: rgba(0,0,0,0.8);
            font-weight: bold;
            text-transform: uppercase;
        }

        .stat-box { margin-bottom: 15px; }
        .label { font-size: 12px; }
        .value { font-size: 20px; text-align: right; }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(158, 173, 134, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        .controls {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 10px;
        }

        .btn {
            height: 60px;
            background: #333;
            border: 2px solid #555;
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 0 #000;
        }

        .btn:active { transform: translateY(3px); box-shadow: none; }
    </style>
</head>
<body>

<div id="device">
    <div id="overlay">
        <h1 id="status-text">ПАУЗА</h1>
        <button id="action-btn" onclick="togglePause()" style="padding:10px 20px; background:#000; color:#fff; border:none; cursor:pointer;">ИГРАТЬ</button>
    </div>

    <canvas id="tetris" class="main-canvas" width="200" height="400"></canvas>

    <div class="side-panel">
        <div class="stat-box">
            <div class="label">Score</div>
            <div class="value" id="score">0</div>
        </div>
        <div class="stat-box">
            <div class="label">Level</div>
            <div class="value" id="level">1</div>
        </div>
        <div class="stat-box">
            <div class="label">Next</div>
            <canvas id="next" width="60" height="60" style="border:1px solid #333; margin-top:5px;"></canvas>
        </div>
        <div style="margin-top:auto; font-size: 10px; cursor:pointer;" onclick="togglePause()">[ PAUSE ]</div>
    </div>
</div>

<div class="controls">
    <div class="btn" style="grid-column: 2" onclick="playerRotate()">↻</div>
    <div class="btn" onclick="playerMove(-1)">←</div>
    <div class="btn" onclick="playerDrop()">↓</div>
    <div class="btn" onclick="playerMove(1)">→</div>
</div>

<script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextContext = nextCanvas.getContext('2d');

    context.scale(20, 20);
    nextContext.scale(15, 15);

    function drawBlock(ctx, x, y, active = true) {
        ctx.fillStyle = active ? '#000' : 'rgba(0,0,0,0.05)';
        ctx.fillRect(x + 0.05, y + 0.05, 0.9, 0.9);
        ctx.strokeStyle = active ? '#9ead86' : 'transparent';
        ctx.lineWidth = 0.1;
        ctx.strokeRect(x + 0.2, y + 0.2, 0.6, 0.6);
    }

    function createPiece(type) {
        const p = {
            'T': [[0, 1, 0], [1, 1, 1], [0, 0, 0]],
            'O': [[1, 1], [1, 1]],
            'L': [[0, 1, 0], [0, 1, 0], [0, 1, 1]],
            'J': [[0, 1, 0], [0, 1, 0], [1, 1, 0]],
            'I': [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]],
            'S': [[0, 1, 1], [1, 1, 0], [0, 0, 0]],
            'Z': [[1, 1, 0], [0, 1, 1], [0, 0, 0]],
        };
        return p[type];
    }

    const arena = Array.from({length: 20}, () => new Array(10).fill(0));
    const player = { pos: {x: 0, y: 0}, matrix: null, next: null, score: 0, level: 1 };

    function draw() {
        context.fillStyle = '#9ead86';
        context.fillRect(0, 0, canvas.width, canvas.height);

        // Фоновая сетка
        for(let y=0; y<20; y++) for(let x=0; x<10; x++) drawBlock(context, x, y, false);

        arena.forEach((row, y) => row.forEach((val, x) => { if(val) drawBlock(context, x, y); }));
        player.matrix.forEach((row, y) => row.forEach((val, x) => {
            if(val) drawBlock(context, x + player.pos.x, y + player.pos.y);
        }));

        // Отрисовка следующей
        nextContext.fillStyle = '#9ead86';
        nextContext.fillRect(0, 0, 4, 4);
        player.next.forEach((row, y) => row.forEach((val, x) => {
            if(val) drawBlock(nextContext, x, y);
        }));
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
            }
        }
        return false;
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => row.forEach((val, x) => {
            if (val) arena[y + player.pos.y][x + player.pos.x] = 1;
        }));
    }

    function arenaSweep() {
        let rowCount = 0;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) if (arena[y][x] === 0) continue outer;
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            rowCount++;
        }
        if (rowCount > 0) {
            player.score += rowCount * 10 * player.level;
            player.level = Math.floor(player.score / 50) + 1; // Повышаем уровень каждые 50 очков
            updateStats();
        }
    }

    function updateStats() {
        document.getElementById('score').innerText = player.score;
        document.getElementById('level').innerText = player.level;
    }

    function playerReset() {
        const pieces = 'ILJOTSZ';
        if(!player.next) player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.matrix = player.next;
        player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        
        // ПРОВЕРКА ПРОИГРЫША
        if (collide(arena, player)) {
            gameOver();
        }
    }

    function gameOver() {
        paused = true;
        document.getElementById('status-text').innerText = "ИГРА ОКОНЧЕНА";
        document.getElementById('action-btn').innerText = "ЗАНОВО";
        document.getElementById('action-btn').onclick = resetGame;
        document.getElementById('overlay').style.display = 'flex';
    }

    function resetGame() {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        player.level = 1;
        updateStats();
        playerReset();
        paused = false;
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('status-text').innerText = "ПАУЗА";
        document.getElementById('action-btn').onclick = togglePause;
    }

    function playerDrop() {
        if (paused) return;
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
        }
        dropCounter = 0;
    }

    function playerMove(dir) {
        if (paused) return;
        player.pos.x += dir;
        if (collide(arena, player)) player.pos.x -= dir;
    }

    function playerRotate() {
        if (paused) return;
        const pos = player.pos.x;
        let offset = 1;
        const m = player.matrix;
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < y; ++x) [m[x][y], m[y][x]] = [m[y][x], m[x][y]];
        }
        m.forEach(row => row.reverse());
        
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > m[0].length) {
                // отмена поворота если некуда двигать
                m.forEach(row => row.reverse());
                for (let y = 0; y < m.length; ++y) {
                    for (let x = 0; x < y; ++x) [m[x][y], m[y][x]] = [m[y][x], m[x][y]];
                }
                player.pos.x = pos;
                return;
            }
        }
    }

    let dropCounter = 0;
    let lastTime = 0;
    let paused = false;

    function togglePause() {
        paused = !paused;
        document.getElementById('overlay').style.display = paused ? 'flex' : 'none';
    }

    function update(time = 0) {
        const deltaTime = time - lastTime;
        lastTime = time;
        if (!paused) {
            dropCounter += deltaTime;
            // ФОРМУЛА УСКОРЕНИЯ: базовая секунда уменьшается на каждом уровне
            const currentSpeed = 1000 * Math.pow(0.8, player.level - 1);
            if (dropCounter > currentSpeed) playerDrop();
            draw();
        }
        requestAnimationFrame(update);
    }

    playerReset();
    update();
</script>
</body>
</html>
