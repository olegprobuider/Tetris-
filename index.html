<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Pro Mobile</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --accent-color: #e94560;
            --button-color: #16213e;
        }

        body {
            background: var(--bg-color);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        /* Анимация пульсации для счета */
        .stats {
            font-size: 24px;
            margin: 15px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: transform 0.1s ease;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        canvas {
            border: 3px solid #30475e;
            background-color: #0f3460;
            display: block;
            height: 65vh;
        }

        /* Меню паузы */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.85);
            display: none; /* Скрыто по умолчанию */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        #overlay h2 { margin-bottom: 20px; font-size: 32px; }

        /* Стили кнопок */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 90%;
            max-width: 320px;
            margin-top: 15px;
        }

        button {
            padding: 18px;
            font-size: 20px;
            background: var(--button-color);
            color: white;
            border: 1px solid #30475e;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
            transition: all 0.1s;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #000;
            background: var(--accent-color);
        }

        .menu-btn {
            width: 180px;
            margin: 10px;
            background: var(--accent-color);
            border: none;
        }

        .pause-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 10px 15px;
            z-index: 11;
        }

        /* Анимация для очистки линий */
        .flash {
            animation: flash-anim 0.2s ease-out;
        }
        @keyframes flash-anim {
            0% { background: #fff; }
            100% { background: transparent; }
        }
    </style>
</head>
<body>

    <div class="stats">SCORE: <span id="score">0</span></div>
    
    <button class="pause-toggle" onclick="togglePause()">II</button>

    <div id="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        
        <!-- Оверлей паузы -->
        <div id="overlay">
            <h2>ПАУЗА</h2>
            <button class="menu-btn" onclick="togglePause()">ПРОДОЛЖИТЬ</button>
            <button class="menu-btn" onclick="resetGame()">СБРОСИТЬ</button>
        </div>
    </div>

    <div class="controls">
        <button style="grid-column: 2" onclick="playerRotate(1)">↻</button>
        <button style="grid-column: 1" onclick="playerMove(-1)">←</button>
        <button style="grid-column: 2" onclick="playerDrop()">↓</button>
        <button style="grid-column: 3" onclick="playerMove(1)">→</button>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const overlay = document.getElementById('overlay');

        context.scale(20, 20);

        let paused = false;

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += rowCount * 10;
                rowCount *= 2;
                
                // Визуальный эффект при сборе линии
                canvas.classList.add('flash');
                setTimeout(() => canvas.classList.remove('flash'), 200);
            }
            updateScore();
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function createMatrix(w, h) {
            return Array.from({length: h}, () => new Array(w).fill(0));
        }

        function createPiece(type) {
            if (type === 'T') return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
            if (type === 'O') return [[2, 2], [2, 2]];
            if (type === 'L') return [[0, 3, 0], [0, 3, 0], [0, 3, 3]];
            if (type === 'J') return [[0, 4, 0], [0, 4, 0], [4, 4, 0]];
            if (type === 'I') return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
            if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
        }

        const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];

        function draw() {
            context.fillStyle = '#0f3460';
            context.fillRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем сетку (тонкие линии)
            context.lineWidth = 0.05;
            context.strokeStyle = '#fff';
            for(let i=0; i<20; i++) context.strokeRect(0, i, 12, 1);
            for(let i=0; i<12; i++) context.strokeRect(i, 0, 1, 20);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        // Эффект градиента или объема для блоков
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        context.strokeStyle = 'white';
                        context.lineWidth = 0.05;
                        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function playerDrop() {
            if (paused) return;
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            if (paused) return;
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
        }

        function playerRotate(dir) {
            if (paused) return;
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                updateScore();
            }
        }

        function updateScore() {
            scoreElement.innerText = player.score;
            scoreElement.parentElement.style.transform = 'scale(1.2)';
            setTimeout(() => scoreElement.parentElement.style.transform = 'scale(1)', 100);
        }

        function togglePause() {
            paused = !paused;
            overlay.style.display = paused ? 'flex' : 'none';
        }

        function resetGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            updateScore();
            playerReset();
            togglePause();
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        function update(time = 0) {
            if (!paused) {
                const deltaTime = time - lastTime;
                lastTime = time;
                dropCounter += deltaTime;
                if (dropCounter > dropInterval) playerDrop();
                draw();
            } else {
                lastTime = time; // Чтобы не было "прыжка" времени после паузы
            }
            requestAnimationFrame(update);
        }

        const arena = createMatrix(12, 20);
        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
        };

        playerReset();
        updateScore();
        update();
    </script>
</body>
</html>
