<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Brick Game</title>
    <style>
        :root {
            --lcd-bg: #9ead86; /* Тот самый цвет старого ЖК-экрана */
            --block-dark: #000;
            --block-light: rgba(0, 0, 0, 0.05);
        }

        body {
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
        }

        #device {
            background: var(--lcd-bg);
            padding: 20px;
            border: 10px solid #222;
            border-radius: 10px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
            display: flex;
            gap: 20px;
            position: relative;
        }

        .main-screen {
            border: 4px solid #444;
            position: relative;
        }

        canvas {
            display: block;
            background: var(--lcd-bg);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-width: 100px;
            text-transform: uppercase;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.8);
        }

        .stat-label { font-size: 14px; margin-bottom: 2px; }
        .stat-value { font-size: 24px; margin-bottom: 15px; text-align: right; letter-spacing: 2px; }

        .next-box {
            width: 80px;
            height: 80px;
            border: 2px solid #444;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Кнопки управления */
        .controls {
            position: fixed;
            bottom: 30px;
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 15px;
        }

        .btn {
            height: 70px;
            background: #222;
            border-radius: 50%;
            color: white;
            border: 3px solid #444;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 #000;
        }

        .btn:active { transform: translateY(4px); box-shadow: none; }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(158, 173, 134, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
    </style>
</head>
<body>

<div id="device">
    <div id="overlay">
        <h2>PAUSE</h2>
        <button onclick="togglePause()" style="padding:10px 20px; background:#000; color:#fff; border:none;">RESUME</button>
        <button onclick="resetGame()" style="padding:10px 20px; margin-top:10px; background:none; border:1px solid #000;">RESET</button>
    </div>

    <div class="main-screen">
        <canvas id="tetris" width="200" height="400"></canvas>
    </div>

    <div class="side-panel">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
        
        <div class="stat-label">Level</div>
        <div class="stat-value" id="level">1</div>

        <div class="stat-label">Next</div>
        <div class="next-box">
            <canvas id="next" width="80" height="80"></canvas>
        </div>
        
        <div style="margin-top: auto; font-size: 12px;" onclick="togglePause()">II PAUSE</div>
    </div>
</div>

<div class="controls">
    <div class="btn" style="grid-column: 2" onclick="playerRotate()">↻</div>
    <div class="btn" style="grid-column: 1" onclick="playerMove(-1)">←</div>
    <div class="btn" style="grid-column: 2" onclick="playerDrop()">↓</div>
    <div class="btn" style="grid-column: 3" onclick="playerMove(1)">→</div>
</div>

<script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next');
    const nextContext = nextCanvas.getContext('2d');

    const BLOCK_SIZE = 20;
    context.scale(BLOCK_SIZE, BLOCK_SIZE);
    nextContext.scale(BLOCK_SIZE, BLOCK_SIZE);

    // Отрисовка ретро-блока (квадрат в квадрате)
    function drawBlock(ctx, x, y, active = true) {
        ctx.fillStyle = active ? '#000' : 'rgba(0,0,0,0.05)';
        ctx.fillRect(x + 0.1, y + 0.1, 0.8, 0.8);
        ctx.strokeStyle = active ? '#9ead86' : 'rgba(158,173,134,0.1)';
        ctx.lineWidth = 0.1;
        ctx.strokeRect(x + 0.25, y + 0.25, 0.5, 0.5);
        ctx.strokeRect(x + 0.1, y + 0.1, 0.8, 0.8);
    }

    function createPiece(type) {
        if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
        if (type === 'L') return [[0,1,0],[0,1,0],[0,1,1]];
        if (type === 'J') return [[0,1,0],[0,1,0],[1,1,0]];
        if (type === 'O') return [[1,1],[1,1]];
        if (type === 'Z') return [[1,1,0],[0,1,1],[0,0,0]];
        if (type === 'S') return [[0,1,1],[1,1,0],[0,0,0]];
        if (type === 'T') return [[0,1,0],[1,1,1],[0,0,0]];
    }

    const arena = Array.from({length: 20}, () => new Array(10).fill(0));
    const player = { pos: {x: 0, y: 0}, matrix: null, next: null, score: 0, level: 1 };

    function draw() {
        // Очистка фона
        context.fillStyle = '#9ead86';
        context.fillRect(0, 0, canvas.width, canvas.height);

        // Сетка фоновых (пустых) блоков
        for (let y = 0; y < 20; y++) {
            for (let x = 0; x < 10; x++) {
                drawBlock(context, x, y, false);
            }
        }

        // Отрисовка застывших блоков
        arena.forEach((row, y) => row.forEach((val, x) => {
            if (val) drawBlock(context, x, y);
        }));

        // Отрисовка активной фигуры
        player.matrix.forEach((row, y) => row.forEach((val, x) => {
            if (val) drawBlock(context, x + player.pos.x, y + player.pos.y);
        }));

        // Отрисовка следующей фигуры
        nextContext.fillStyle = '#9ead86';
        nextContext.fillRect(0, 0, 4, 4);
        player.next.forEach((row, y) => row.forEach((val, x) => {
            if (val) drawBlock(nextContext, x, y);
        }));
    }

    // --- Логика игры (упрощенно) ---
    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
            }
        }
        return false;
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => row.forEach((val, x) => {
            if (val) arena[y + player.pos.y][x + player.pos.x] = 1;
        }));
    }

    function rotate(matrix) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
        matrix.forEach(row => row.reverse());
    }

    function playerReset() {
        const pieces = 'ILJOTSZ';
        if (!player.next) player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.matrix = player.next;
        player.next = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        if (collide(arena, player)) {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.level = 1;
        }
    }

    function playerDrop() {
        if (paused) return;
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
        }
        dropCounter = 0;
    }

    function arenaSweep() {
        let rowsCleared = 0;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) if (arena[y][x] === 0) continue outer;
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            rowsCleared++;
        }
        if (rowsCleared > 0) {
            player.score += rowsCleared * 10 * player.level;
            player.level = Math.floor(player.score / 100) + 1;
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = player.level;
        }
    }

    function playerMove(dir) {
        if (paused) return;
        player.pos.x += dir;
        if (collide(arena, player)) player.pos.x -= dir;
    }

    function playerRotate() {
        if (paused) return;
        const pos = player.pos.x;
        rotate(player.matrix);
        let offset = 1;
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix); // Назад
                player.pos.x = pos;
                return;
            }
        }
    }

    let dropCounter = 0;
    let lastTime = 0;
    let paused = false;

    function togglePause() {
        paused = !paused;
        document.getElementById('overlay').style.display = paused ? 'flex' : 'none';
    }

    function resetGame() {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        player.level = 1;
        document.getElementById('score').innerText = "0";
        document.getElementById('level').innerText = "1";
        playerReset();
        togglePause();
    }

    function update(time = 0) {
        const deltaTime = time - lastTime;
        lastTime = time;
        if (!paused) {
            dropCounter += deltaTime;
            if (dropCounter > (1000 - (player.level * 50))) playerDrop();
            draw();
        }
        requestAnimationFrame(update);
    }

    playerReset();
    update();
</script>
</body>
</html>
